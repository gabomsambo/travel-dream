name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test -- --ci --passWithNoTests
        env:
          TURSO_DATABASE_URL: "file:ci-test.db"
          TURSO_AUTH_TOKEN: "fake-token-for-build"
          AUTH_SECRET: "ci-test-secret-32-chars-minimum!!"
          AUTH_GOOGLE_ID: "fake-google-id"
          AUTH_GOOGLE_SECRET: "fake-google-secret"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Build
        run: npm run build
        env:
          TURSO_DATABASE_URL: "file:ci-test.db"
          TURSO_AUTH_TOKEN: "fake-token-for-build"
          AUTH_SECRET: "ci-test-secret-32-chars-minimum!!"
          AUTH_GOOGLE_ID: "fake-google-id"
          AUTH_GOOGLE_SECRET: "fake-google-secret"
          NEXTAUTH_URL: "http://localhost:3000"

  # Migration drift guard. Replays the migration journal into a throwaway local
  # SQLite file and compares it against docs/db/prod-schema-reference.sql — the
  # only check here that can notice a migration landed without the database
  # being migrated. tsc, jest and next build all pass in that situation; PR #30
  # did exactly that and took production down for an hour.
  #
  # A separate job on purpose:
  #   - it needs a Node with `node:sqlite` unflagged (the `ci` job pins 20,
  #     where the module does not exist and the script cannot even load), and
  #     bumping the whole job would change the runtime under tsc/jest/build
  #     for no benefit here;
  #   - it needs no dependencies, no credentials and no network, so it skips
  #     `npm ci` entirely and finishes in seconds, in parallel with `ci`.
  #
  # ADVISORY ONLY, TODAY. This job can report red on a PR but cannot block a
  # merge: `main` has no branch protection and the `TabidreamsV1` ruleset
  # declares only `deletion` and `non_fast_forward` — no required status checks,
  # which is also why the `ci` job never blocked PR #30. Enabling required
  # status checks on `main` for the `ci` and `schema-drift` contexts is
  # authorised and happens immediately after this PR merges; it deliberately
  # cannot happen in this PR, because a required check that has never run on
  # `main` blocks every merge including this one. The status check context is
  # the job name below, exactly `schema-drift` — match that string when
  # configuring it.
  schema-drift:
    name: schema-drift
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches .nvmrc. `node:sqlite` was added in Node 22.5, behind
          # `--experimental-sqlite` at first; this resolves to the latest
          # 22.x, where it is on by default.
          node-version: 22

      - name: Migration drift guard
        run: node scripts/verify-baseline-schema.mjs
